name: lantern
description: Q VPN
publish_to: "none"

version: 9.0.29+96

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0 <4.0.0"

dependency_overrides:
  stripe_android: 12.4.0
  stripe_ios: 12.4.0
  in_app_purchase_storekit: 0.4.8+1
  in_app_purchase_android: 0.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.1
  path_provider: ^2.1.5
  auto_route: ^11.1.0
  flutter_earth_globe: ^2.2.0
  lottie: ^3.3.1
  animated_toggle_switch: ^0.8.7
  animated_text_kit: ^4.3.0
  flutter_screenutil: ^5.9.3
  auto_size_text: ^3.0.0
  badges: ^3.2.0
  pinput: ^6.0.2
  email_validator: ^3.0.0
  shimmer: ^3.0.0
  animated_loading_border: ^0.0.2
  loader_overlay: ^5.0.0
  i18n_extension: ^15.1.1
  i18n_extension_importer: ^0.0.6
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  flutter_loggy: ^2.0.3+1
  loggy: ^2.0.3
  ffi: ^2.2.0
  flutter_riverpod: ^3.3.1
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.2
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  qr_flutter: ^4.1.0
  app_links: ^7.0.0
  fpdart: ^1.2.0
  jwt_decoder: ^2.0.1
  mobile_scanner: ^7.2.0
  device_info_plus: ^13.2.0
  flutter_inappwebview: ^6.1.5
  store_checker: ^1.8.0
  in_app_review: ^2.0.12
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: 0.4.8+1
  flutter_stripe: 12.4.0
  protobuf: ^6.0.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  fixnum: ^1.1.1
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  flutter_carousel_widget: ^3.1.1
  file_selector: ^1.1.0
  image_picker: ^1.2.2
  http: ^1.2.0
  pub_semver: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.4.0
  build_runner: ^2.12.2
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  ffigen: ^21.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/locales/
    - assets/unbounded/
    - app.env

ffigen:
  name: "LanternBindings"
  output: "lib/lantern/lantern_generated_bindings.dart"
  headers:
    entry-points:
      - "bin/**/liblantern.h"
